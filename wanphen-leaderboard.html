<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanphen Wall of Fame</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#12100e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="1PEN Vault">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Import Chart.js for the graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --brass-light: #d4af37; --brass-dark: #8a6522; --copper: #b87333; --bg-dark: #12100e; --panel-bg: #1e1a17; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); background-image: radial-gradient(circle at center, #2a241e 0%, #0d0b0a 100%), url('https://www.transparenttextures.com/patterns/stardust.png'); color: var(--brass-light); font-family: 'Playfair Display', serif; min-height: 100vh; padding: 20px; }
        
        header { text-align: center; margin-bottom: 40px; position: relative; }
        .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--copper); text-decoration: none; font-family: 'Cinzel', serif; font-size: 1.2rem; border: 1px solid var(--copper); padding: 5px 15px; transition: 0.3s; }
        .back-btn:hover { background: var(--copper); color: var(--bg-dark); }
        h1 { font-family: 'Cinzel', serif; font-size: 3.5rem; background: linear-gradient(to bottom, var(--brass-light), var(--brass-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); text-transform: uppercase; letter-spacing: 2px;}
        
        .container { max-width: 1000px; margin: 0 auto; background: rgba(30, 26, 23, 0.9); border: 2px solid var(--brass-dark); padding: 40px; box-shadow: 0 0 30px rgba(0,0,0,0.9); border-radius: 8px; }
        
        .controls { text-align: center; margin-bottom: 30px; }
        select { background: #000; color: var(--brass-light); border: 1px solid var(--brass-dark); padding: 15px; font-family: 'Cinzel', serif; font-size: 1.2rem; width: 60%; cursor: pointer; outline: none; }
        select:focus { border-color: var(--brass-light); box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .stat-box { background: rgba(0,0,0,0.6); border: 1px solid var(--border-color); padding: 20px; text-align: center; border-radius: 5px; }
        .stat-title { font-family: 'Cinzel', serif; color: var(--copper); font-size: 1.1rem; margin-bottom: 10px; text-transform: uppercase; }
        .stat-value { font-size: 2rem; color: #fff; text-shadow: 0 0 10px var(--brass-light); }

        .chart-container { background: rgba(0,0,0,0.4); padding: 20px; border: 1px dashed var(--brass-dark); border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">← Main Menu</a>
        <h1>1PEN Wall of Fame</h1>
    </header>

    <div class="container">
        <div class="controls">
            <!-- Values updated to perfectly match your Cloud SQL Game Names -->
            <select id="game-selector" onchange="updateDashboard()">
                <option value="" disabled selected>-- Select a Game to View Analytics --</option>
                <option value="Brass: Birmingham">Brass: Birmingham</option>
                <option value="Brass: Lancashire">Brass: Lancashire</option>
                <option value="The White Castle">The White Castle</option>
                <option value="The White Castle: Matcha">The White Castle: Matcha</option>
                <option value="Viticulture">Viticulture</option>
                <option value="Concordia">Concordia</option>
                <option value="Flip 7">Flip 7</option>
                <option value="6 nimmt!">6 nimmt!</option>
                <option value="Wingspan">Wingspan</option>
            </select>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-title">Total Games Logged</div>
                <div class="stat-value" id="total-games">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Most Active Player</div>
                <div class="stat-value" id="most-active">-</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>
    </div>

    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker failed:', err)); });
        }
    </script>
    
    <script>
        // Define sorting logic based on the game name
        const gameRules = {
            'Brass: Birmingham': { sort: 'high' }, 'Brass: Lancashire': { sort: 'high' },
            'The White Castle': { sort: 'high' }, 'The White Castle: Matcha': { sort: 'high' },
            'Viticulture': { sort: 'high' }, 'Concordia': { sort: 'high' },
            'Flip 7': { sort: 'high' }, 'Wingspan': { sort: 'high' },
            '6 nimmt!': { sort: 'low' } // 6 nimmt! lowest score wins
        };

        let scoreChart = null;

        function updateDashboard() {
            const gameKey = document.getElementById('game-selector').value;
            const sortRule = gameRules[gameKey].sort;

            // Set loading states
            document.getElementById('total-games').innerText = "Loading...";
            document.getElementById('most-active').innerText = "Loading...";
            if (scoreChart) { scoreChart.destroy(); scoreChart = null; }

            // Fetch live data from Aiven SQL
            fetch('/.netlify/functions/getHistory?game=' + encodeURIComponent(gameKey))
            .then(response => response.json())
            .then(data => {
                if (!data || data.length === 0) {
                    document.getElementById('total-games').innerText = "0";
                    document.getElementById('most-active').innerText = "N/A";
                    renderChart([], "No Data Found");
                    return;
                }

                document.getElementById('total-games').innerText = data.length;

                let allScores = [];
                let playCounts = {};

                // Crunch the numbers
                data.forEach(game => {
                    game.scores.forEach(player => {
                        let pName = player.name.trim();
                        let pScore = parseInt(player.final);
                        if (pName && !isNaN(pScore)) {
                            allScores.push({ name: pName, score: pScore, date: game.date });
                            playCounts[pName] = (playCounts[pName] || 0) + 1;
                        }
                    });
                });

                // Find Most Active Player
                let mostActive = Object.keys(playCounts).reduce((a, b) => playCounts[a] > playCounts[b] ? a : b, "");
                document.getElementById('most-active').innerText = `${mostActive} (${playCounts[mostActive]})`;

                // Sort Scores (High to Low, unless 6 nimmt!)
                allScores.sort((a, b) => sortRule === 'high' ? b.score - a.score : a.score - b.score);
                let top5 = allScores.slice(0, 5);
                
                renderChart(top5, sortRule === 'high' ? 'All-Time Highest Scores' : 'All-Time Lowest Bullheads');
            })
            .catch(error => {
                document.getElementById('total-games').innerText = "Error";
                document.getElementById('most-active').innerText = "Error";
                console.error("Cloud Fetch Error:", error);
                alert("Failed to pull analytics from the cloud database.");
            });
        }

        function renderChart(topScores, titleText) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            if (scoreChart) scoreChart.destroy();

            scoreChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: topScores.map(s => `${s.name} (${s.date})`),
                    datasets: [{
                        label: 'Score',
                        data: topScores.map(s => s.score),
                        backgroundColor: 'rgba(212, 175, 55, 0.7)',
                        borderColor: '#d4af37',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: titleText, color: '#d4af37', font: { family: 'Cinzel', size: 24 } }
                    },
                    scales: {
                        y: { ticks: { color: '#b87333', font: { size: 14 } }, grid: { color: 'rgba(74, 59, 34, 0.3)' } },
                        x: { ticks: { color: '#b87333', font: { size: 14 } }, grid: { display: false } }
                    }
                }
            });
        }
    </script>
</body>
</html>
